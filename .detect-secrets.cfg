# detect-secrets configuration
# https://github.com/Yelp/detect-secrets
#
# The single source of truth is .secrets.baseline (auto-generated).
# CI enforces it via: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
#
# To regenerate the baseline:
#   detect-secrets scan \
#     --exclude-files '(^|/)node_modules(/|$)|(^|/)dist(/|$)|(^|/)coverage(/|$)|(^|/)package-lock\.json$|(^|/)pnpm-lock\.yaml$|\.snap$' \
#     > .secrets.baseline
#
# To audit false positives:
#   detect-secrets audit .secrets.baseline
#
# Version: detect-secrets==1.5.0
