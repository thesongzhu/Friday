name: Nightly Heavy CI

on:
  schedule:
    # Daily at 10:00 UTC (about 2am Pacific in winter / 3am in summer)
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install smoke test
        run: npm run test:install:smoke

  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release check
        run: npm run release:check

  platform-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Core SQLite tests
        run: npx vitest run test/unit/state/sqlite

      - name: HTTP route tests
        run: npx vitest run test/unit/api/http

      - name: CLI tests
        run: npx vitest run test/unit/cli

  docker-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify Dockerfile build
        run: docker build -f docker/Dockerfile -t friday:ci-verify .

  docker-runtime-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: docker-build-verify
    if: ${{ vars.FRIDAY_DOCKER_E2E_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Docker runtime smoke
        run: npm run test:docker:e2e:runtime

      - name: Upload docker runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-runtime-${{ github.run_id }}
          path: artifacts/docker-e2e/
          if-no-files-found: warn

  docker-bootstrap-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: docker-build-verify
    if: ${{ vars.FRIDAY_DOCKER_E2E_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Docker bootstrap smoke
        run: npm run test:docker:e2e:bootstrap

      - name: Upload docker bootstrap artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-bootstrap-${{ github.run_id }}
          path: artifacts/docker-e2e/
          if-no-files-found: warn

  docker-plugins-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: docker-build-verify
    if: ${{ vars.FRIDAY_DOCKER_E2E_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Docker plugins smoke
        run: npm run test:docker:e2e:plugins

      - name: Upload docker plugin artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-plugins-${{ github.run_id }}
          path: artifacts/docker-e2e/
          if-no-files-found: warn

  cloud-contract-openai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.contract.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evaluate cloud contract (OpenAI baseline)
        id: contract
        env:
          FRIDAY_E2E_TARGET: "cloud"
          FRIDAY_E2E_CLOUD_BASE_URL: ${{ vars.FRIDAY_CLOUD_E2E_BASE_URL }}
          FRIDAY_E2E_CLOUD_AUTH_MODE: "access-token"
          FRIDAY_E2E_CLOUD_ACCESS_TOKEN: ${{ secrets.FRIDAY_E2E_CLOUD_ACCESS_TOKEN }}
          FRIDAY_E2E_CLOUD_NAMESPACE: "nightly-openai-${{ github.run_id }}"
          FRIDAY_E2E_CLOUD_TIMEOUT_MS: "30000"
          FRIDAY_E2E_LIVE_OPENAI: "1"
          FRIDAY_E2E_LIVE_OLLAMA: "0"
        run: |
          set -euo pipefail
          mkdir -p artifacts/cloud-contract
          set +e
          FRIDAY_CLOUD_CONTRACT_REPORT_PATH=artifacts/cloud-contract/report.json \
            node scripts/e2e/check-friday-cloud-contract.mjs
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Nightly cloud contract is ready." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$status" -eq 78 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Nightly cloud contract skipped because required cloud inputs are missing." >> "$GITHUB_STEP_SUMMARY"
            if [ -f artifacts/cloud-contract/report.json ]; then
              node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync("artifacts/cloud-contract/report.json", "utf8")); const blockers = Array.isArray(report.blockers) ? report.blockers : []; if (blockers.length > 0) { console.log(""); console.log("Blockers:"); for (const blocker of blockers) console.log(`- ${blocker}`); }' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          exit "$status"

      - name: Upload cloud contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-contract-openai-${{ github.run_id }}
          path: artifacts/cloud-contract/
          if-no-files-found: warn

  cloud-live-e2e-openai:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: cloud-contract-openai
    if: ${{ needs.cloud-contract-openai.outputs.ready == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run cloud live e2e (OpenAI baseline)
        env:
          CI: "true"
          FRIDAY_E2E_TARGET: "cloud"
          FRIDAY_E2E_CLOUD_BASE_URL: ${{ vars.FRIDAY_CLOUD_E2E_BASE_URL }}
          FRIDAY_E2E_CLOUD_AUTH_MODE: "access-token"
          FRIDAY_E2E_CLOUD_ACCESS_TOKEN: ${{ secrets.FRIDAY_E2E_CLOUD_ACCESS_TOKEN }}
          FRIDAY_E2E_CLOUD_NAMESPACE: "nightly-openai-${{ github.run_id }}"
          FRIDAY_E2E_CLOUD_TIMEOUT_MS: "30000"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          E2E_OPENAI_API_KEY_ENV: OPENAI_API_KEY # pragma: allowlist secret
          FRIDAY_E2E_LIVE_OPENAI: "1"
          FRIDAY_E2E_LIVE_OLLAMA: "0"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx vitest run test/e2e/live/friday-cloud-journeys.e2e.test.ts \
            2>&1 | tee artifacts/cloud-live-e2e-openai.log

      - name: Upload cloud e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-live-openai-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
