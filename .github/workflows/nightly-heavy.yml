name: Nightly Heavy CI

on:
  schedule:
    # Daily at 10:00 UTC (about 2am Pacific in winter / 3am in summer)
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install smoke test
        run: npm run test:install:smoke

  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release check
        run: npm run release:check

  platform-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Core SQLite tests
        run: npx vitest run test/unit/state/sqlite

      - name: HTTP route tests
        run: npx vitest run test/unit/api/http

      - name: CLI tests
        run: npx vitest run test/unit/cli

  docker-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Dockerfile build
        run: docker build -f Dockerfile -t friday:ci-verify .

  docker-e2e-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: docker-build-verify
    if: ${{ vars.FRIDAY_DOCKER_E2E_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker runtime closure smoke
        run: bash scripts/ci/docker-e2e-smoke.sh

      - name: Upload docker e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-${{ github.run_id }}
          path: artifacts/docker-e2e/
          if-no-files-found: warn

  cloud-e2e-openai:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evaluate cloud baseline config
        id: cloud_config
        env:
          CLOUD_BASE_URL: ${{ vars.FRIDAY_CLOUD_E2E_BASE_URL }}
          CLOUD_ACCESS_TOKEN: ${{ secrets.FRIDAY_E2E_CLOUD_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          MISSING=0
          if [ -z "${CLOUD_BASE_URL:-}" ]; then
            echo "::warning::Missing repository variable FRIDAY_CLOUD_E2E_BASE_URL"
            MISSING=1
          fi
          if [ -z "${CLOUD_ACCESS_TOKEN:-}" ]; then
            echo "::warning::Missing secret FRIDAY_E2E_CLOUD_ACCESS_TOKEN"
            MISSING=1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::Missing secret OPENAI_API_KEY"
            MISSING=1
          fi

          if [ "${MISSING}" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping cloud OpenAI E2E because baseline config is incomplete."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cloud live e2e (OpenAI baseline)
        if: ${{ steps.cloud_config.outputs.ready == 'true' }}
        env:
          CI: "true"
          FRIDAY_E2E_TARGET: "cloud"
          FRIDAY_E2E_CLOUD_BASE_URL: ${{ vars.FRIDAY_CLOUD_E2E_BASE_URL }}
          FRIDAY_E2E_CLOUD_AUTH_MODE: "access-token"
          FRIDAY_E2E_CLOUD_ACCESS_TOKEN: ${{ secrets.FRIDAY_E2E_CLOUD_ACCESS_TOKEN }}
          FRIDAY_E2E_CLOUD_NAMESPACE: "nightly-openai-${{ github.run_id }}"
          FRIDAY_E2E_CLOUD_TIMEOUT_MS: "30000"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          E2E_OPENAI_API_KEY_ENV: OPENAI_API_KEY # pragma: allowlist secret
          FRIDAY_E2E_LIVE_OPENAI: "1"
          FRIDAY_E2E_LIVE_OLLAMA: "0"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx vitest run test/e2e/live/friday-cloud-journeys.e2e.test.ts \
            2>&1 | tee artifacts/cloud-live-e2e-openai.log

      - name: Upload cloud e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-live-e2e-openai-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
