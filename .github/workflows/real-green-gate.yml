name: Real Green Gate

on:
  workflow_dispatch:
    inputs:
      phase24b_discord_trusted_inbound:
        description: "Run the manual Phase24B Discord trusted-user inbound listener."
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - "codex/**"

jobs:
  real-green-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: phase-24-live-channels
    env:
      FRIDAY_BASE_URL: ${{ secrets.FRIDAY_BASE_URL }}
      FRIDAY_UI_BASE_URL: ${{ secrets.FRIDAY_UI_BASE_URL }}
      FRIDAY_ACCESS_TOKEN: ${{ secrets.FRIDAY_ACCESS_TOKEN }}
      FRIDAY_LOCAL_PASSPHRASE: ${{ secrets.FRIDAY_LOCAL_PASSPHRASE }}
      FRIDAY_REAL_WORLD_MINT_LOCAL_ADMIN_TOKEN: ${{ secrets.FRIDAY_REAL_WORLD_MINT_LOCAL_ADMIN_TOKEN }}
      FRIDAY_REAL_WORLD_MINT_STATE_DB_PATH: ${{ secrets.FRIDAY_REAL_WORLD_MINT_STATE_DB_PATH }}
      FRIDAY_REAL_WORLD_MINT_TOKEN_SECRET_FILE: ${{ secrets.FRIDAY_REAL_WORLD_MINT_TOKEN_SECRET_FILE }}
      FRIDAY_REAL_WORLD_DESKTOP_READY: ${{ secrets.FRIDAY_REAL_WORLD_DESKTOP_READY }}
      FRIDAY_REAL_WORLD_EXTERNAL_CHANNELS_READY: ${{ secrets.FRIDAY_REAL_WORLD_EXTERNAL_CHANNELS_READY }}
      FRIDAY_DISCORD_BOT_TOKEN: ${{ secrets.FRIDAY_DISCORD_BOT_TOKEN }}
      FRIDAY_DISCORD_SETUP_USER_ID: ${{ secrets.FRIDAY_DISCORD_SETUP_USER_ID || vars.FRIDAY_DISCORD_SETUP_USER_ID }}
      FRIDAY_DISCORD_GUILD_ID: ${{ secrets.FRIDAY_DISCORD_GUILD_ID || vars.FRIDAY_DISCORD_GUILD_ID }}
      FRIDAY_DISCORD_CHANNEL_ID: ${{ secrets.FRIDAY_DISCORD_CHANNEL_ID || vars.FRIDAY_DISCORD_CHANNEL_ID }}
      FRIDAY_DISCORD_BOT_USER_ID: ${{ secrets.FRIDAY_DISCORD_BOT_USER_ID || vars.FRIDAY_DISCORD_BOT_USER_ID }}
      FRIDAY_DISCORD_APPROVAL_MODE: ${{ secrets.FRIDAY_DISCORD_APPROVAL_MODE || vars.FRIDAY_DISCORD_APPROVAL_MODE }}
      FRIDAY_DISCORD_GROUP_APPROVAL: ${{ secrets.FRIDAY_DISCORD_GROUP_APPROVAL || vars.FRIDAY_DISCORD_GROUP_APPROVAL }}
      FRIDAY_DISCORD_REQUIRE_MENTION: ${{ secrets.FRIDAY_DISCORD_REQUIRE_MENTION || vars.FRIDAY_DISCORD_REQUIRE_MENTION }}
      FRIDAY_TELEGRAM_BOT_TOKEN: ${{ secrets.FRIDAY_TELEGRAM_BOT_TOKEN }}
      FRIDAY_TELEGRAM_CHAT_ID: ${{ secrets.FRIDAY_TELEGRAM_CHAT_ID || vars.FRIDAY_TELEGRAM_CHAT_ID }}
      FRIDAY_TELEGRAM_ALLOWED_USER_ID: ${{ secrets.FRIDAY_TELEGRAM_ALLOWED_USER_ID || vars.FRIDAY_TELEGRAM_ALLOWED_USER_ID }}
      FRIDAY_TELEGRAM_MODE: ${{ secrets.FRIDAY_TELEGRAM_MODE || vars.FRIDAY_TELEGRAM_MODE }}
      FRIDAY_TELEGRAM_APPROVAL_MODE: ${{ secrets.FRIDAY_TELEGRAM_APPROVAL_MODE || vars.FRIDAY_TELEGRAM_APPROVAL_MODE }}
      FRIDAY_TELEGRAM_GROUP_APPROVAL: ${{ secrets.FRIDAY_TELEGRAM_GROUP_APPROVAL || vars.FRIDAY_TELEGRAM_GROUP_APPROVAL }}
      FRIDAY_LARK_APP_ID: ${{ secrets.FRIDAY_LARK_APP_ID || vars.FRIDAY_LARK_APP_ID }}
      FRIDAY_LARK_APP_SECRET: ${{ secrets.FRIDAY_LARK_APP_SECRET }}
      FRIDAY_LARK_CHAT_ID: ${{ secrets.FRIDAY_LARK_CHAT_ID || vars.FRIDAY_LARK_CHAT_ID }}
      FRIDAY_LARK_GROUP_CHAT_ID: ${{ secrets.FRIDAY_LARK_GROUP_CHAT_ID || vars.FRIDAY_LARK_GROUP_CHAT_ID }}
      FRIDAY_LARK_ALLOWED_USER_ID: ${{ secrets.FRIDAY_LARK_ALLOWED_USER_ID || vars.FRIDAY_LARK_ALLOWED_USER_ID }}
      FRIDAY_LARK_USE_FEISHU: ${{ secrets.FRIDAY_LARK_USE_FEISHU || vars.FRIDAY_LARK_USE_FEISHU }}
      FRIDAY_LARK_RECEIVE_MODE: ${{ secrets.FRIDAY_LARK_RECEIVE_MODE || vars.FRIDAY_LARK_RECEIVE_MODE }}
      FRIDAY_LARK_APPROVAL_MODE: ${{ secrets.FRIDAY_LARK_APPROVAL_MODE || vars.FRIDAY_LARK_APPROVAL_MODE }}
      FRIDAY_LARK_GROUP_APPROVAL: ${{ secrets.FRIDAY_LARK_GROUP_APPROVAL || vars.FRIDAY_LARK_GROUP_APPROVAL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FRIDAY_DEEPSEEK_API_KEY: ${{ secrets.FRIDAY_DEEPSEEK_API_KEY }}
      FRIDAY_REAL_WORLD_CLOUD_READY: ${{ secrets.FRIDAY_REAL_WORLD_CLOUD_READY }}
      FRIDAY_REAL_WORLD_SATELLITE_READY: ${{ secrets.FRIDAY_REAL_WORLD_SATELLITE_READY }}
      FRIDAY_REAL_WORLD_MCP_READY: ${{ secrets.FRIDAY_REAL_WORLD_MCP_READY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate catalog
        run: npm run validate:real-world:catalog

      - name: Check branch conformance
        run: node scripts/ops/check-branch-conformance.mjs --branch "${{ github.ref_name }}" --report-root "$RUNNER_TEMP/real-green-gate/branch"

      - name: Run real green gate against configured runtime
        if: env.FRIDAY_BASE_URL != '' || env.FRIDAY_ACCESS_TOKEN != '' || env.FRIDAY_LOCAL_PASSPHRASE != '' || env.FRIDAY_REAL_WORLD_MINT_LOCAL_ADMIN_TOKEN != ''
        run: npm run ops:real-green-gate -- --branch "${{ github.ref_name }}" --report-root "$RUNNER_TEMP/real-green-gate"

      - name: Run real green gate against self-hosted runtime
        if: env.FRIDAY_BASE_URL == '' && env.FRIDAY_ACCESS_TOKEN == '' && env.FRIDAY_LOCAL_PASSPHRASE == '' && env.FRIDAY_REAL_WORLD_MINT_LOCAL_ADMIN_TOKEN == ''
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          FRIDAY_ANTHROPIC_API_KEY: ${{ secrets.FRIDAY_ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/real-green-gate"
          if ! npm run build; then
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { buildErroredResult, REAL_GREEN_GATE_RESULT_FILENAME } from "./scripts/ops/lib/real-green-gate-result.mjs";

          const reportRoot = path.join(process.env.RUNNER_TEMP ?? ".", "real-green-gate");
          fs.mkdirSync(reportRoot, { recursive: true });
          fs.writeFileSync(
            path.join(reportRoot, REAL_GREEN_GATE_RESULT_FILENAME),
            `${JSON.stringify(buildErroredResult({
              commitSha: process.env.GITHUB_SHA ?? "",
              refName: process.env.GITHUB_REF_NAME ?? "",
              evaluatedAt: new Date().toISOString(),
              blockedReasons: ["self_hosted_runtime_build_failed"],
            }), null, 2)}\n`,
            "utf8",
          );
          NODE
            exit 1
          fi
          node scripts/ops/run-real-green-gate-self-hosted.mjs --branch "${{ github.ref_name }}" --report-root "$RUNNER_TEMP/real-green-gate"

      - name: Upload real green gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-green-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/real-green-gate

  phase24b-discord-trusted-inbound:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase24b_discord_trusted_inbound == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-24-live-channels
    env:
      FRIDAY_DISCORD_BOT_TOKEN: ${{ secrets.FRIDAY_DISCORD_BOT_TOKEN }}
      FRIDAY_DISCORD_SETUP_USER_ID: ${{ secrets.FRIDAY_DISCORD_SETUP_USER_ID || vars.FRIDAY_DISCORD_SETUP_USER_ID }}
      FRIDAY_DISCORD_GUILD_ID: ${{ secrets.FRIDAY_DISCORD_GUILD_ID || vars.FRIDAY_DISCORD_GUILD_ID }}
      FRIDAY_DISCORD_CHANNEL_ID: ${{ secrets.FRIDAY_DISCORD_CHANNEL_ID || vars.FRIDAY_DISCORD_CHANNEL_ID }}
      FRIDAY_DISCORD_BOT_USER_ID: ${{ secrets.FRIDAY_DISCORD_BOT_USER_ID || vars.FRIDAY_DISCORD_BOT_USER_ID }}
      FRIDAY_DISCORD_REQUIRE_MENTION: ${{ secrets.FRIDAY_DISCORD_REQUIRE_MENTION || vars.FRIDAY_DISCORD_REQUIRE_MENTION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FRIDAY_DEEPSEEK_API_KEY: ${{ secrets.FRIDAY_DEEPSEEK_API_KEY }}
      PHASE24B_DISCORD_LISTENER_TIMEOUT_MS: "480000"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Wait for trusted Discord user-origin message
        run: PHASE24B_REPORT_ROOT="$RUNNER_TEMP/phase24b-discord-trusted-inbound" npm run ops:phase24b:discord-trusted-inbound

      - name: Upload Phase24B Discord trusted inbound artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase24b-discord-trusted-inbound-${{ github.run_id }}
          path: ${{ runner.temp }}/phase24b-discord-trusted-inbound
