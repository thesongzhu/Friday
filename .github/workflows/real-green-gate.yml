name: Real Green Gate

on:
  workflow_dispatch:
    inputs:
      phase24b_discord_trusted_inbound:
        description: "Run the manual Phase24B Discord trusted-user inbound listener."
        required: false
        type: boolean
        default: false
      phase24c_telegram_trusted_inbound:
        description: "Run the manual Phase24C Telegram trusted-user inbound listener."
        required: false
        type: boolean
        default: false
      phase24d_lark_feishu_trusted_inbound:
        description: "Run the manual Phase24D Lark/Feishu trusted-user inbound listener."
        required: false
        type: boolean
        default: false
      phase24e_telegram_workflow_candidate:
        description: "Run the manual Phase24E Telegram channel-driven workflow-candidate approve/reject listener."
        required: false
        type: boolean
        default: false
      phase24f_discord_workflow_candidate:
        description: "Run the manual Phase24F Discord channel-driven workflow-candidate approve/reject listener."
        required: false
        type: boolean
        default: false
      phase24g_lark_feishu_workflow_candidate:
        description: "Run the manual Phase24G Lark/Feishu channel-driven workflow-candidate approve/reject listener."
        required: false
        type: boolean
        default: false
      phase24h_telegram_natural_trigger:
        description: "Run the manual Phase24H Telegram channel-driven natural-trigger listener with live DeepSeek."
        required: false
        type: boolean
        default: false
      c3c4_provider_routing_proof:
        description: "Run the C3/C4 live DeepSeek-primary/OpenAI-fallback provider routing and self-healing proof."
        required: false
        type: boolean
        default: false
      c45_real_user_intelligence_proof:
        description: "Run the C4.5 live real-user intelligence gauntlet with synthetic fixtures."
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - "codex/**"

jobs:
  real-green-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: phase-24-live-channels
    env:
      FRIDAY_BASE_URL: ${{ secrets.FRIDAY_BASE_URL }}
      FRIDAY_UI_BASE_URL: ${{ secrets.FRIDAY_UI_BASE_URL }}
      FRIDAY_ACCESS_TOKEN: ${{ secrets.FRIDAY_ACCESS_TOKEN }}
      FRIDAY_LOCAL_PASSPHRASE: ${{ secrets.FRIDAY_LOCAL_PASSPHRASE }}
      FRIDAY_REAL_WORLD_MINT_LOCAL_ADMIN_TOKEN: ${{ secrets.FRIDAY_REAL_WORLD_MINT_LOCAL_ADMIN_TOKEN }}
      FRIDAY_REAL_WORLD_MINT_STATE_DB_PATH: ${{ secrets.FRIDAY_REAL_WORLD_MINT_STATE_DB_PATH }}
      FRIDAY_REAL_WORLD_MINT_TOKEN_SECRET_FILE: ${{ secrets.FRIDAY_REAL_WORLD_MINT_TOKEN_SECRET_FILE }}
      FRIDAY_REAL_WORLD_DESKTOP_READY: ${{ secrets.FRIDAY_REAL_WORLD_DESKTOP_READY }}
      FRIDAY_REAL_WORLD_EXTERNAL_CHANNELS_READY: ${{ secrets.FRIDAY_REAL_WORLD_EXTERNAL_CHANNELS_READY }}
      FRIDAY_DISCORD_BOT_TOKEN: ${{ secrets.FRIDAY_DISCORD_BOT_TOKEN }}
      FRIDAY_DISCORD_SETUP_USER_ID: ${{ secrets.FRIDAY_DISCORD_SETUP_USER_ID || vars.FRIDAY_DISCORD_SETUP_USER_ID }}
      FRIDAY_DISCORD_GUILD_ID: ${{ secrets.FRIDAY_DISCORD_GUILD_ID || vars.FRIDAY_DISCORD_GUILD_ID }}
      FRIDAY_DISCORD_CHANNEL_ID: ${{ secrets.FRIDAY_DISCORD_CHANNEL_ID || vars.FRIDAY_DISCORD_CHANNEL_ID }}
      FRIDAY_DISCORD_BOT_USER_ID: ${{ secrets.FRIDAY_DISCORD_BOT_USER_ID || vars.FRIDAY_DISCORD_BOT_USER_ID }}
      FRIDAY_DISCORD_APPROVAL_MODE: ${{ secrets.FRIDAY_DISCORD_APPROVAL_MODE || vars.FRIDAY_DISCORD_APPROVAL_MODE }}
      FRIDAY_DISCORD_GROUP_APPROVAL: ${{ secrets.FRIDAY_DISCORD_GROUP_APPROVAL || vars.FRIDAY_DISCORD_GROUP_APPROVAL }}
      FRIDAY_DISCORD_REQUIRE_MENTION: ${{ secrets.FRIDAY_DISCORD_REQUIRE_MENTION || vars.FRIDAY_DISCORD_REQUIRE_MENTION }}
      FRIDAY_TELEGRAM_BOT_TOKEN: ${{ secrets.FRIDAY_TELEGRAM_BOT_TOKEN }}
      FRIDAY_TELEGRAM_CHAT_ID: ${{ secrets.FRIDAY_TELEGRAM_CHAT_ID || vars.FRIDAY_TELEGRAM_CHAT_ID }}
      FRIDAY_TELEGRAM_ALLOWED_USER_ID: ${{ secrets.FRIDAY_TELEGRAM_ALLOWED_USER_ID || vars.FRIDAY_TELEGRAM_ALLOWED_USER_ID }}
      FRIDAY_TELEGRAM_MODE: ${{ secrets.FRIDAY_TELEGRAM_MODE || vars.FRIDAY_TELEGRAM_MODE }}
      FRIDAY_TELEGRAM_APPROVAL_MODE: ${{ secrets.FRIDAY_TELEGRAM_APPROVAL_MODE || vars.FRIDAY_TELEGRAM_APPROVAL_MODE }}
      FRIDAY_TELEGRAM_GROUP_APPROVAL: ${{ secrets.FRIDAY_TELEGRAM_GROUP_APPROVAL || vars.FRIDAY_TELEGRAM_GROUP_APPROVAL }}
      FRIDAY_LARK_APP_ID: ${{ secrets.FRIDAY_LARK_APP_ID || vars.FRIDAY_LARK_APP_ID }}
      FRIDAY_LARK_APP_SECRET: ${{ secrets.FRIDAY_LARK_APP_SECRET }}
      FRIDAY_LARK_CHAT_ID: ${{ secrets.FRIDAY_LARK_CHAT_ID || vars.FRIDAY_LARK_CHAT_ID }}
      FRIDAY_LARK_GROUP_CHAT_ID: ${{ secrets.FRIDAY_LARK_GROUP_CHAT_ID || vars.FRIDAY_LARK_GROUP_CHAT_ID }}
      FRIDAY_LARK_ALLOWED_USER_ID: ${{ secrets.FRIDAY_LARK_ALLOWED_USER_ID || vars.FRIDAY_LARK_ALLOWED_USER_ID }}
      FRIDAY_LARK_USE_FEISHU: ${{ secrets.FRIDAY_LARK_USE_FEISHU || vars.FRIDAY_LARK_USE_FEISHU }}
      FRIDAY_LARK_RECEIVE_MODE: ${{ secrets.FRIDAY_LARK_RECEIVE_MODE || vars.FRIDAY_LARK_RECEIVE_MODE }}
      FRIDAY_LARK_APPROVAL_MODE: ${{ secrets.FRIDAY_LARK_APPROVAL_MODE || vars.FRIDAY_LARK_APPROVAL_MODE }}
      FRIDAY_LARK_GROUP_APPROVAL: ${{ secrets.FRIDAY_LARK_GROUP_APPROVAL || vars.FRIDAY_LARK_GROUP_APPROVAL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FRIDAY_DEEPSEEK_API_KEY: ${{ secrets.FRIDAY_DEEPSEEK_API_KEY }}
      FRIDAY_REAL_GREEN_GATE_LIVE_PROVIDER_MODE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'economy' }}
      FRIDAY_REAL_WORLD_CLOUD_READY: ${{ secrets.FRIDAY_REAL_WORLD_CLOUD_READY }}
      FRIDAY_REAL_WORLD_SATELLITE_READY: ${{ secrets.FRIDAY_REAL_WORLD_SATELLITE_READY }}
      FRIDAY_REAL_WORLD_MCP_READY: ${{ secrets.FRIDAY_REAL_WORLD_MCP_READY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate catalog
        run: npm run validate:real-world:catalog

      - name: Check branch conformance
        run: node scripts/ops/check-branch-conformance.mjs --branch "${{ github.ref_name }}" --report-root "$RUNNER_TEMP/real-green-gate/branch"

      - name: Run real green gate against configured runtime
        if: env.FRIDAY_BASE_URL != '' || env.FRIDAY_ACCESS_TOKEN != '' || env.FRIDAY_LOCAL_PASSPHRASE != '' || env.FRIDAY_REAL_WORLD_MINT_LOCAL_ADMIN_TOKEN != ''
        run: npm run ops:real-green-gate -- --branch "${{ github.ref_name }}" --report-root "$RUNNER_TEMP/real-green-gate"

      - name: Run real green gate against self-hosted runtime
        if: env.FRIDAY_BASE_URL == '' && env.FRIDAY_ACCESS_TOKEN == '' && env.FRIDAY_LOCAL_PASSPHRASE == '' && env.FRIDAY_REAL_WORLD_MINT_LOCAL_ADMIN_TOKEN == ''
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          FRIDAY_ANTHROPIC_API_KEY: ${{ secrets.FRIDAY_ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/real-green-gate"
          if ! npm run build; then
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { buildErroredResult, REAL_GREEN_GATE_RESULT_FILENAME } from "./scripts/ops/lib/real-green-gate-result.mjs";

          const reportRoot = path.join(process.env.RUNNER_TEMP ?? ".", "real-green-gate");
          fs.mkdirSync(reportRoot, { recursive: true });
          fs.writeFileSync(
            path.join(reportRoot, REAL_GREEN_GATE_RESULT_FILENAME),
            `${JSON.stringify(buildErroredResult({
              commitSha: process.env.GITHUB_SHA ?? "",
              refName: process.env.GITHUB_REF_NAME ?? "",
              evaluatedAt: new Date().toISOString(),
              blockedReasons: ["self_hosted_runtime_build_failed"],
            }), null, 2)}\n`,
            "utf8",
          );
          NODE
            exit 1
          fi
          node scripts/ops/run-real-green-gate-self-hosted.mjs --branch "${{ github.ref_name }}" --report-root "$RUNNER_TEMP/real-green-gate"

      - name: Upload real green gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-green-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/real-green-gate

  phase24b-discord-trusted-inbound:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase24b_discord_trusted_inbound == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-24-live-channels
    env:
      FRIDAY_DISCORD_BOT_TOKEN: ${{ secrets.FRIDAY_DISCORD_BOT_TOKEN }}
      FRIDAY_DISCORD_SETUP_USER_ID: ${{ secrets.FRIDAY_DISCORD_SETUP_USER_ID || vars.FRIDAY_DISCORD_SETUP_USER_ID }}
      FRIDAY_DISCORD_GUILD_ID: ${{ secrets.FRIDAY_DISCORD_GUILD_ID || vars.FRIDAY_DISCORD_GUILD_ID }}
      FRIDAY_DISCORD_CHANNEL_ID: ${{ secrets.FRIDAY_DISCORD_CHANNEL_ID || vars.FRIDAY_DISCORD_CHANNEL_ID }}
      FRIDAY_DISCORD_BOT_USER_ID: ${{ secrets.FRIDAY_DISCORD_BOT_USER_ID || vars.FRIDAY_DISCORD_BOT_USER_ID }}
      FRIDAY_DISCORD_REQUIRE_MENTION: ${{ secrets.FRIDAY_DISCORD_REQUIRE_MENTION || vars.FRIDAY_DISCORD_REQUIRE_MENTION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FRIDAY_DEEPSEEK_API_KEY: ${{ secrets.FRIDAY_DEEPSEEK_API_KEY }}
      PHASE24B_DISCORD_LISTENER_TIMEOUT_MS: "480000"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Wait for trusted Discord user-origin message
        run: PHASE24B_REPORT_ROOT="$RUNNER_TEMP/phase24b-discord-trusted-inbound" npm run ops:phase24b:discord-trusted-inbound

      - name: Upload Phase24B Discord trusted inbound artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase24b-discord-trusted-inbound-${{ github.run_id }}
          path: ${{ runner.temp }}/phase24b-discord-trusted-inbound

  c3c4-provider-routing-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.c3c4_provider_routing_proof == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: phase-24-live-channels
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FRIDAY_DEEPSEEK_API_KEY: ${{ secrets.FRIDAY_DEEPSEEK_API_KEY }}
      FRIDAY_E2E_LIVE_DEEPSEEK: "1"
      FRIDAY_C3C4_DEEPSEEK_MODEL: "deepseek-v4-pro"
      FRIDAY_C3C4_OPENAI_MODEL: "gpt-4o-mini"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Log C3/C4 provider intent
        run: |
          echo "C3/C4 live provider batch intent: DeepSeek primary route, explicit OpenAI fallback route, spend labels, unavailable invalid/disabled lanes, and live self-healing recovery/rollback proof."
          echo "Expected providers/models: DeepSeek deepseek-v4-pro primary; OpenAI gpt-4o-mini fallback."
          echo "Expected spend: bounded under the USD 50 C2.4/C3/C4 cap; proof prompts are short synthetic no-sensitive-data tasks."
          echo "No provider secret values are printed or persisted by this job."

      - name: Preflight C3/C4 provider credentials
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-${FRIDAY_DEEPSEEK_API_KEY:-}}" ]; then
            echo "::error::C3/C4 provider proof requires a DeepSeek credential secret."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::C3/C4 provider proof requires an OpenAI credential secret for fallback proof."
            exit 1
          fi

      - name: Run C3/C4 provider routing proof
        run: FRIDAY_C3C4_PROVIDER_REPORT_ROOT="$RUNNER_TEMP/c3c4-provider-routing-proof" npx vitest run test/e2e/live/friday-provider-routing-c3c4-live.e2e.test.ts

      - name: Run C3/C4 live self-healing proof
        run: npx vitest run test/e2e/live/friday-self-healing-live.e2e.test.ts

      - name: Upload C3/C4 provider routing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3c4-provider-routing-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/c3c4-provider-routing-proof

  c45-real-user-intelligence-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.c45_real_user_intelligence_proof == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: phase-24-live-channels
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FRIDAY_DEEPSEEK_API_KEY: ${{ secrets.FRIDAY_DEEPSEEK_API_KEY }}
      FRIDAY_C45_REAL_USER_GAUNTLET: "1"
      FRIDAY_E2E_LIVE_DEEPSEEK: "1"
      FRIDAY_C45_DEEPSEEK_MODEL: "deepseek-v4-pro"
      FRIDAY_C45_OPENAI_MODEL: "gpt-4o-mini"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run --silent build:api

      - name: Log C4.5 provider intent
        run: |
          echo "C4.5 live real-user intelligence proof: synthetic deck/report/table extraction, analysis, ambiguity handling, deck-like generation, prompt-injection denial, and source immutability."
          echo "Primary provider/model: DeepSeek deepseek-v4-pro."
          echo "Direct synthetic analysis provider/model: OpenAI gpt-4o-mini live lane."
          echo "Expected spend: bounded under the separate USD 100 C4.5 cap."
          echo "No provider secret values, private user files, or real user data are printed or persisted by this job."
          echo "This dispatch intentionally does not start a live Telegram/Discord/Lark channel window."

      - name: Preflight C4.5 provider credentials
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-${FRIDAY_DEEPSEEK_API_KEY:-}}" ]; then
            echo "::error::C4.5 proof requires a DeepSeek credential secret."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::C4.5 proof requires an OpenAI credential secret for direct synthetic analysis."
            exit 1
          fi
          echo "OpenAI credential present; C4.5 direct synthetic analysis lane will run."

      - name: Run C4.5 real-user intelligence gauntlet
        run: FRIDAY_C45_REPORT_ROOT="$RUNNER_TEMP/c45-real-user-intelligence-proof" npx vitest run test/e2e/live/friday-real-user-intelligence-c45-live.e2e.test.ts

      - name: Validate C4.5 proof artifact exists
        run: test -s "$RUNNER_TEMP/c45-real-user-intelligence-proof/c45-real-user-intelligence-proof.json"

      - name: Upload C4.5 real-user intelligence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c45-real-user-intelligence-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/c45-real-user-intelligence-proof
          if-no-files-found: error

  phase24c-telegram-trusted-inbound:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase24c_telegram_trusted_inbound == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-24-live-channels
    env:
      FRIDAY_TELEGRAM_BOT_TOKEN: ${{ secrets.FRIDAY_TELEGRAM_BOT_TOKEN }}
      FRIDAY_TELEGRAM_CHAT_ID: ${{ secrets.FRIDAY_TELEGRAM_CHAT_ID || vars.FRIDAY_TELEGRAM_CHAT_ID }}
      FRIDAY_TELEGRAM_ALLOWED_USER_ID: ${{ secrets.FRIDAY_TELEGRAM_ALLOWED_USER_ID || vars.FRIDAY_TELEGRAM_ALLOWED_USER_ID }}
      FRIDAY_TELEGRAM_MODE: ${{ secrets.FRIDAY_TELEGRAM_MODE || vars.FRIDAY_TELEGRAM_MODE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FRIDAY_DEEPSEEK_API_KEY: ${{ secrets.FRIDAY_DEEPSEEK_API_KEY }}
      PHASE24C_TELEGRAM_LISTENER_TIMEOUT_MS: "480000"
      PHASE24C_TELEGRAM_POLLING_TIMEOUT_SEC: "5"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Wait for trusted Telegram user-origin message
        run: PHASE24C_REPORT_ROOT="$RUNNER_TEMP/phase24c-telegram-trusted-inbound" npm run ops:phase24c:telegram-trusted-inbound

      - name: Upload Phase24C Telegram trusted inbound artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase24c-telegram-trusted-inbound-${{ github.run_id }}
          path: ${{ runner.temp }}/phase24c-telegram-trusted-inbound

  phase24d-lark-feishu-trusted-inbound:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase24d_lark_feishu_trusted_inbound == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-24-live-channels
    env:
      FRIDAY_LARK_APP_ID: ${{ secrets.FRIDAY_LARK_APP_ID || vars.FRIDAY_LARK_APP_ID }}
      FRIDAY_LARK_APP_SECRET: ${{ secrets.FRIDAY_LARK_APP_SECRET }}
      FRIDAY_LARK_CHAT_ID: ${{ secrets.FRIDAY_LARK_CHAT_ID || vars.FRIDAY_LARK_CHAT_ID }}
      FRIDAY_LARK_GROUP_CHAT_ID: ${{ secrets.FRIDAY_LARK_GROUP_CHAT_ID || vars.FRIDAY_LARK_GROUP_CHAT_ID }}
      FRIDAY_LARK_ALLOWED_USER_ID: ${{ secrets.FRIDAY_LARK_ALLOWED_USER_ID || vars.FRIDAY_LARK_ALLOWED_USER_ID }}
      FRIDAY_LARK_USE_FEISHU: ${{ secrets.FRIDAY_LARK_USE_FEISHU || vars.FRIDAY_LARK_USE_FEISHU }}
      FRIDAY_LARK_RECEIVE_MODE: ${{ secrets.FRIDAY_LARK_RECEIVE_MODE || vars.FRIDAY_LARK_RECEIVE_MODE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FRIDAY_DEEPSEEK_API_KEY: ${{ secrets.FRIDAY_DEEPSEEK_API_KEY }}
      PHASE24D_LARK_FEISHU_LISTENER_TIMEOUT_MS: "480000"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Wait for trusted Lark/Feishu user-origin message
        run: PHASE24D_REPORT_ROOT="$RUNNER_TEMP/phase24d-lark-feishu-trusted-inbound" npm run ops:phase24d:lark-feishu-trusted-inbound

      - name: Upload Phase24D Lark/Feishu trusted inbound artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase24d-lark-feishu-trusted-inbound-${{ github.run_id }}
          path: ${{ runner.temp }}/phase24d-lark-feishu-trusted-inbound

  phase24e-telegram-workflow-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase24e_telegram_workflow_candidate == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: phase-24-live-channels
    env:
      FRIDAY_TELEGRAM_BOT_TOKEN: ${{ secrets.FRIDAY_TELEGRAM_BOT_TOKEN }}
      FRIDAY_TELEGRAM_CHAT_ID: ${{ secrets.FRIDAY_TELEGRAM_CHAT_ID || vars.FRIDAY_TELEGRAM_CHAT_ID }}
      FRIDAY_TELEGRAM_ALLOWED_USER_ID: ${{ secrets.FRIDAY_TELEGRAM_ALLOWED_USER_ID || vars.FRIDAY_TELEGRAM_ALLOWED_USER_ID }}
      FRIDAY_TELEGRAM_MODE: ${{ secrets.FRIDAY_TELEGRAM_MODE || vars.FRIDAY_TELEGRAM_MODE }}
      PHASE24E_TELEGRAM_LISTENER_TIMEOUT_MS: "1800000"
      PHASE24E_TELEGRAM_POLLING_TIMEOUT_SEC: "5"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Wait for trusted Telegram operator reject + approve messages
        run: PHASE24E_REPORT_ROOT="$RUNNER_TEMP/phase24e-telegram-workflow-candidate" npm run ops:phase24e:telegram-workflow-candidate

      - name: Upload Phase24E Telegram workflow-candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase24e-telegram-workflow-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/phase24e-telegram-workflow-candidate

  phase24f-discord-workflow-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase24f_discord_workflow_candidate == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: phase-24-live-channels
    env:
      FRIDAY_DISCORD_BOT_TOKEN: ${{ secrets.FRIDAY_DISCORD_BOT_TOKEN }}
      FRIDAY_DISCORD_SETUP_USER_ID: ${{ secrets.FRIDAY_DISCORD_SETUP_USER_ID || vars.FRIDAY_DISCORD_SETUP_USER_ID }}
      FRIDAY_DISCORD_GUILD_ID: ${{ secrets.FRIDAY_DISCORD_GUILD_ID || vars.FRIDAY_DISCORD_GUILD_ID }}
      FRIDAY_DISCORD_CHANNEL_ID: ${{ secrets.FRIDAY_DISCORD_CHANNEL_ID || vars.FRIDAY_DISCORD_CHANNEL_ID }}
      FRIDAY_DISCORD_BOT_USER_ID: ${{ secrets.FRIDAY_DISCORD_BOT_USER_ID || vars.FRIDAY_DISCORD_BOT_USER_ID }}
      FRIDAY_DISCORD_REQUIRE_MENTION: ${{ secrets.FRIDAY_DISCORD_REQUIRE_MENTION || vars.FRIDAY_DISCORD_REQUIRE_MENTION }}
      PHASE24F_DISCORD_LISTENER_TIMEOUT_MS: "1800000"
