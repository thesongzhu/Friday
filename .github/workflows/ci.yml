name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── MECHANISM-1: Gate 1 — Build + Type + Lint ──
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Check pnpm native build allowlist
        run: node scripts/quality/check-pnpm-native-build-allowlist.mjs

      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build API
        run: npm run build:api

      - name: Build UI
        run: npm run build:ui

  # ── MECHANISM-1: Gate 2 — Unit + Integration Tests ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Selected served UI design fidelity
        run: npm run check:served-ui-design-fidelity

      - name: Unit/Integration + Core E2E tests
        env:
          FRIDAY_E2E_CORE: "1"
        run: |
          npm test
          npm run test:e2e:ui

  # ── MECHANISM-2: Gate 3 — Migration Chain Integrity ──
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Check migration chain integrity
        run: node scripts/quality/check-migrations.mjs

  # ── DEPLOY-PARITY: lockfile/schema PR body declarations ──
  # Lockfile changes must carry native-module build proof, and schema changes
  # must declare that Rust services require restart during deploy.
  prod-parity-pr-body:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Collect PR changed files
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > "$RUNNER_TEMP/prod-parity-changed-files.txt"

      - name: Initialize changed files for push
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          : > "$RUNNER_TEMP/prod-parity-changed-files.txt"

      - name: Check prod-parity PR body declarations
        run: node scripts/quality/check-prod-parity-pr-body.mjs --event "$GITHUB_EVENT_PATH" --changed-files "$RUNNER_TEMP/prod-parity-changed-files.txt"

  # ── MECHANISM-3: Gate 4 — Security Regression Gate ──
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done

      - name: Adversarial suite integrity check
        run: node scripts/quality/check-adversarial-suite.mjs

      - name: Run adversarial tests
        run: npx vitest run test/adversarial

  # ── MECHANISM-4: Gate — API + Type Contract Gate ──
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done

      - name: Contract tests (routes + types)
        run: npm run test:contracts

  # ── MECHANISM-5: Gate 5 — SSD Marker Lint ──
  ssd-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: SSD marker lint
        run: node scripts/quality/check-ssd-markers.mjs

  # ── MECHANISM-5a: Proof Anti-Mock Contamination Gate ──
  proof-no-mock-leaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done

      - name: Proof no-mock leak gate
        run: npm run check:proof:no-mock-leaks

  # ── MECHANISM-5b: Scope/Alignment Guard ──
  alignment-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Agent parity alignment guard
        run: node scripts/quality/check-openclaw-alignment-guard.mjs

  # ── MECHANISM-5c: Agent Parity Acceptance ──
  agent-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done

      - name: Run agent parity acceptance suite
        run: npm run test:integration:agent-parity

  # ── MECHANISM-6: Secret Detection ──
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Enforce secrets baseline
        run: |
          # Generated proof/audit artifacts contain commit SHAs, correlation ids, and
          # encoded payload fragments that trigger deterministic false positives.
          # Keep source-code scanning strict while excluding machine-generated report JSONs
          # plus remediation evidence bundles, runtime state snapshots under audit-fix/,
          # and the static acceptance prototype/evidence surfaces whose embedded hashes
          # and redacted mock credentials deterministically trip entropy/keyword plugins.
          git ls-files -z | xargs -0 detect-secrets-hook \
            --baseline .secrets.baseline \
            --exclude-files '(^|/)node_modules(/|$)|(^|/)dist(/|$)|(^|/)coverage(/|$)|(^|/)package-lock\.json$|(^|/)pnpm-lock\.yaml$|\.snap$|(^|/)managed-skills/[^/]+/conversion\.report\.json$|(^|/)docs/reports/ops/.*\.csv$|(^|/)docs/reports/ops/real-green-gate/.*\.json$|(^|/)docs/reports/repo/FRIDAY_.*\.json$|(^|/)audit-fix/[^/]+\.(csv|json)$|(^|/)audit-fix/fix-phase-status/.*\.(csv|json)$|(^|/)audit-fix/post-fix-evidence/.*\.(json|csv|txt|png)$|(^|/)audit-fix/runtime/.*\.(json|jsonl|txt|png|csv)$|(^|/)screenshots/.*\.(json|png|pdf|txt|html)$|(^|/)polish-report\.html$|(^|/)friday-static\.prod\.html$|(^|/)friday-static\.html$'
          echo "✅ No new secrets detected"

      - name: Enforce provider key pattern denylist
        run: node scripts/quality/check-provider-key-patterns.mjs

      - name: Remediation guidance
        if: failure()
        run: |
          echo "::error::🔑 New secret detected in source code!"
          echo ""
          echo "To fix:"
          echo "  1. Remove the secret from the code"
          echo "  2. If it's a false positive, update the baseline:"
          echo "     detect-secrets scan --exclude-files '(^|/)node_modules(/|$)|(^|/)dist(/|$)|(^|/)coverage(/|$)|(^|/)package-lock\\.json$|(^|/)pnpm-lock\\.yaml$|\\.snap$|(^|/)managed-skills/[^/]+/conversion\\.report\\.json$|(^|/)docs/reports/ops/.*\\.csv$|(^|/)docs/reports/ops/real-green-gate/.*\\.json$|(^|/)docs/reports/repo/FRIDAY_.*\\.json$|(^|/)screenshots/.*\\.(json|png|pdf|txt|html)$|(^|/)polish-report\\.html$|(^|/)friday-static\\.prod\\.html$|(^|/)friday-static\\.html$' > .secrets.baseline"
          echo "     detect-secrets audit .secrets.baseline"
          echo "  3. Commit the updated .secrets.baseline"

  # ── MECHANISM-7: TS-Runtime-Retirement Gate — blocker==0 enforced ──
  ts-runtime-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      # Validator runs over the REAL src/api/http/routes + real manifest and
      # enforces classification completeness/well-formedness. It prints its JSON
      # report to stdout (captured via `>` so the validator's own exit code still
      # gates this step) and exits non-zero on any unclassified/malformed route.
      - name: Validate TS-runtime-retirement classification
        run: node scripts/quality/check-ts-runtime-retirement.mjs > ts-runtime-retirement-report.json

      - name: Show validator report
        run: cat ts-runtime-retirement-report.json

      # The validator exits 0 even for a *validly* classified ts_runtime_blocker.
      # This assertion enforces ts_runtime_blocker == 0 against silent regression
      # by parsing summary.blockerFamilies from the validator's report.
      - name: Assert ts_runtime_blocker count is zero
        run: node scripts/quality/assert-ts-runtime-blocker-zero.mjs ts-runtime-retirement-report.json

      # SECOND validation phase: the route validator above is structurally blind
      # to service-METHOD guards. Surfaces that are route-retired but still reach
      # their mutating service methods off-route (agent tools, UIX/reflex callers,
      # standing-agenda) are fenced by method-head fail-closed guards (TS-R1 / #628
      # / #597) that the route validator cannot see — so stripping one would
      # un-retire a live surface while route blocker stays 0. This gate scans the
      # configured service files (manifest.methodRetiredSurfaces) and asserts every
      # declared mutating method still carries its guard, and that the manifest
      # entry counts have not silently shrunk. Builtins-only; own non-zero exit.
      - name: Assert TS-runtime method-guard coverage + no manifest shrinkage
        run: node scripts/quality/assert-ts-runtime-method-guards.mjs

  # ── MECHANISM-8: Prod-Flag Loop-Test Gate (registry gap #27) ──
  # Enforces "every prod-ON (and dark) loop flag names an existing loop-closing
  # e2e test" against docs/ops/prod-flags-manifest.json. This is the single
  # recurrence-prevention gate behind the L0 silently-inert-loop disaster: a flag
  # may never go prod-ON with no committed loop test. Pure Node + fs (no compiler,
  # no test execution) — fast + deterministic. It validates the mapping EXISTS and
  # resolves; the tests themselves are RUN by rust-core.yml + the `test` job.
  prod-flag-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Verify every prod-ON flag maps to a loop e2e test
        run: node scripts/ci/verify-prod-flag-tests.mjs

  # ── MECHANISM-9: L1 Mechanism Wiring Matrix Gate ──
  # Reconciles the Rust-owned coarse mechanism matrix with the current-head docs
  # and critical TS fail-closed mutation fences. This prevents L1 from drifting
  # back into ungrounded percentage claims or stale "wired" labels.
  mechanism-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done

      - name: Verify L1 mechanism wiring matrix
        run: npm run test:mechanism-wiring

      - name: Run L1 method-retired behavior tests
        run: npm run test:mechanism-wiring:behavior

  # ── T1 Client Ship Gate ──
  # Keeps native client packaging hooks visible to CI so current-code app artifacts
  # cannot quietly drift behind the server/diagnostic proof path again.
  client-ship-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done

      - name: Validate client ship gate wiring
        run: npm run check:client-ship-gate

  # ── Terminal CI Aggregator — single required check for branch protection ──
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, test, migrations, prod-parity-pr-body, security, contracts, ssd-lint, proof-no-mock-leaks, alignment-guard, agent-parity, secrets, ts-runtime-retirement, prod-flag-tests, mechanism-wiring, client-ship-gate]
    if: ${{ always() }}

    steps:
      - name: Check all gates passed
        run: |
          echo "Build:              ${{ needs.build.result }}"
          echo "Test:               ${{ needs.test.result }}"
          echo "Migrations:         ${{ needs.migrations.result }}"
          echo "Prod Parity Body:   ${{ needs.prod-parity-pr-body.result }}"
          echo "Security:           ${{ needs.security.result }}"
          echo "Contracts:          ${{ needs.contracts.result }}"
          echo "SSD Lint:           ${{ needs.ssd-lint.result }}"
          echo "Proof No-Mock Leaks:${{ needs.proof-no-mock-leaks.result }}"
          echo "Alignment Guard:    ${{ needs.alignment-guard.result }}"
          echo "Agent Parity:       ${{ needs.agent-parity.result }}"
          echo "Secrets:            ${{ needs.secrets.result }}"
          echo "TS Runtime Retire:  ${{ needs.ts-runtime-retirement.result }}"
          echo "Prod-Flag Tests:    ${{ needs.prod-flag-tests.result }}"
          echo "Mechanism Wiring:   ${{ needs.mechanism-wiring.result }}"
          echo "Client Ship Gate:   ${{ needs.client-ship-gate.result }}"
          echo ""

          FAILED=0
          for result in \
            "${{ needs.build.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.migrations.result }}" \
            "${{ needs.prod-parity-pr-body.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.contracts.result }}" \
            "${{ needs.ssd-lint.result }}" \
            "${{ needs.proof-no-mock-leaks.result }}" \
            "${{ needs.alignment-guard.result }}" \
            "${{ needs.agent-parity.result }}" \
            "${{ needs.secrets.result }}" \
            "${{ needs.ts-runtime-retirement.result }}" \
            "${{ needs.prod-flag-tests.result }}" \
            "${{ needs.mechanism-wiring.result }}" \
            "${{ needs.client-ship-gate.result }}" \
          ; do
            if [ "$result" != "success" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Quality gate FAILED — one or more jobs did not succeed"
            exit 1
          fi
          echo "✅ Quality gate passed — all jobs succeeded"
