name: Rust Core

# Gates the all-Rust Friday Core workspace (rust-core/) added by the
# Rust/mobile rewrite. Runs only when rust-core or this workflow changes.
on:
  push:
    branches:
      - main
    paths:
      - "rust-core/**"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "rust-core/**"
      - ".github/workflows/rust-core.yml"

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust-core
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # rustup is preinstalled on ubuntu runners; rust-core/rust-toolchain.toml
      # pins 1.95.0 + clippy/rustfmt, which `rustup show` installs.
      - name: Toolchain
        run: rustup show && cargo --version && cargo clippy --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build bins (incl. S0 hub_run_task write-bridge)
        # `cargo clippy --all-targets` / `cargo test --workspace` already compile every
        # bin, so this is technically redundant — but it names the S0 dev write-bridge
        # explicitly so a missing/compile-broken `hub_run_task` reds CI loudly. The bin is
        # only BUILT here; running it needs FRIDAY_DEEPSEEK_API_KEY (the separate live-proof
        # step), so it is never executed in CI.
        run: cargo build -p friday-hub --bin hub_run_task
      - name: Build bins (incl. S2 hub_run_readback read-bridge)
        # Read-only sibling of S0's hub_run_task: names the S2 dev read-bridge explicitly so
        # a missing/compile-broken `hub_run_readback` reds CI loudly. Only BUILT here — the
        # TS bridge test spawns a scripted MOCK bin instead (no DB, no key, no quota).
        run: cargo build -p friday-hub --bin hub_run_readback
      - name: Build bins (incl. read-only hub_providers_detect surface)
        # Read-only providers-detect surface over friday_providers::detect: names the bin
        # explicitly so a missing/compile-broken `hub_providers_detect` reds CI loudly. Only
        # BUILT here — running it invokes ONLY each provider CLI's local read-only `status`
        # command (no model call, no quota, no network beyond the CLI's own auth check, no
        # secret), so it is safe but unnecessary to execute in CI.
        run: cargo build -p friday-hub --bin hub_providers_detect
      - name: Test
        # The one live DeepSeek test is #[ignore]d, so this needs no network/secrets.
        run: cargo test --workspace
