name: Rust Core

# Gates the all-Rust Friday Core workspace (rust-core/) added by the
# Rust/mobile rewrite. Runs only when rust-core or this workflow changes.
on:
  push:
    branches:
      - main
    paths:
      - "rust-core/**"
      - ".github/workflows/rust-core.yml"
      - "src/api/http/routes/friday-memory-spine-routes.ts"
      - "src/api/mission-spine/friday-memory-spine-dispatch-adapter.ts"
      - "src/api/mission-spine/friday-rust-hub-agent-run-ws-sealed-client.ts"
      - "test/interop/**"
      - "package.json"
      - "package-lock.json"
      - "docs/ops/prod-flags-manifest.json"
  pull_request:
    paths:
      - "rust-core/**"
      - ".github/workflows/rust-core.yml"
      - "src/api/http/routes/friday-memory-spine-routes.ts"
      - "src/api/mission-spine/friday-memory-spine-dispatch-adapter.ts"
      - "src/api/mission-spine/friday-rust-hub-agent-run-ws-sealed-client.ts"
      - "test/interop/**"
      - "package.json"
      - "package-lock.json"
      - "docs/ops/prod-flags-manifest.json"

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rust-core
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # rustup is preinstalled on ubuntu runners; rust-core/rust-toolchain.toml
      # pins 1.95.0 + clippy/rustfmt, which `rustup show` installs.
      - name: Toolchain
        run: rustup show && cargo --version && cargo clippy --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build bins (incl. S0 hub_run_task write-bridge)
        # `cargo clippy --all-targets` / `cargo test --workspace` already compile every
        # bin, so this is technically redundant — but it names the S0 dev write-bridge
        # explicitly so a missing/compile-broken `hub_run_task` reds CI loudly. The bin is
        # only BUILT here; running it needs FRIDAY_DEEPSEEK_API_KEY (the separate live-proof
        # step), so it is never executed in CI.
        run: cargo build -p friday-hub --bin hub_run_task
      - name: Build bins (incl. S2 hub_run_readback read-bridge)
        # Read-only sibling of S0's hub_run_task: names the S2 dev read-bridge explicitly so
        # a missing/compile-broken `hub_run_readback` reds CI loudly. Only BUILT here — the
        # TS bridge test spawns a scripted MOCK bin instead (no DB, no key, no quota).
        run: cargo build -p friday-hub --bin hub_run_readback
      - name: Build bins (incl. read-only hub_providers_detect surface)
        # Read-only providers-detect surface over friday_providers::detect: names the bin
        # explicitly so a missing/compile-broken `hub_providers_detect` reds CI loudly. Only
        # BUILT here — running it invokes ONLY each provider CLI's local read-only `status`
        # command (no model call, no quota, no network beyond the CLI's own auth check, no
        # secret), so it is safe but unnecessary to execute in CI.
        run: cargo build -p friday-hub --bin hub_providers_detect
      - name: Build bins (incl. read-only diagnostics_snapshot surface)
        # Read-only projection of diagnostics::DiagnosticsSnapshot::collect: names the bin
        # explicitly so a missing/compile-broken `diagnostics_snapshot` reds CI loudly. Only
        # BUILT here — running it just opens a hub DB read-only and emits refs-only counts /
        # audit-chain status / truth-labels (no model call, no quota, no network, no secret),
        # so it is safe but unnecessary to execute in CI.
        run: cargo build -p friday-hub --bin diagnostics_snapshot
      - name: Build bins (incl. Rust-owned hub_extract_memory inline extraction)
        # FIRST Rust-ownership slice of the session-memory "moat": names the inline
        # memory-extraction bin explicitly so a missing/compile-broken
        # `hub_extract_memory` reds CI loudly. Only BUILT here — running it needs
        # FRIDAY_DEEPSEEK_API_KEY + a real session DB and spends quota (the coordinator's
        # separate live-proof), so it is never executed in CI. The unit tests use a
        # scripted MOCK provider (no key, no quota, no network).
        run: cargo build -p friday-hub --bin hub_extract_memory
      - name: Build bins (incl. read-only hub_workflow_def_inspect surface)
        # Read-only refs-only inspector of the S8 workflow_definition store: names the
        # bin explicitly so a missing/compile-broken `hub_workflow_def_inspect` reds CI
        # loudly. Only BUILT here — running it opens a hub DB read-only (strict
        # schema-version equality) and emits refs-only counts/labels through the shared
        # forbidden-marker guard (no bodies, no model call, no quota, no network, no
        # secret), so it is safe but unnecessary to execute in CI.
        run: cargo build -p friday-hub --bin hub_workflow_def_inspect
      - name: Build bins (incl. S9 hub_workflow_run write-bridge)
        # S9 manual workflow-run dev write-bridge (stored definition → S8 loader → the
        # EXISTING workflow_exec engine, hard-wired deny-all so mutating steps stay
        # gate-paused): names the bin explicitly so a missing/compile-broken
        # `hub_workflow_run` reds CI loudly. Only BUILT here — running it executes a
        # stored workflow against a dev DB/workspace (refs-only receipt, no production
        # route, no scheduler), and live manual PRODUCTION workflow runs remain
        # operator-gated, so it is never executed in CI.
        run: cargo build -p friday-hub --bin hub_workflow_run
      - name: Build bins (incl. read-only hub_workflow_run_readback surface)
        # Read-only refs-only projection of one workflow run's run/step rows (the rows
        # workflow_exec persists): names the bin explicitly so a missing/compile-broken
        # `hub_workflow_run_readback` reds CI loudly. Only BUILT here — running it opens
        # a hub DB read-only and emits refs-only labels/counts through the shared
        # forbidden-marker guard (no bodies, no params, no evidence text, no model call,
        # no quota, no network, no secret), so it is safe but unnecessary to execute in CI.
        run: cargo build -p friday-hub --bin hub_workflow_run_readback
      - name: Test
        # The one live DeepSeek test is #[ignore]d, so this needs no network/secrets.
        run: cargo test --workspace
      - name: Provider failover loop proofs
        # P0 multi-angle stress residue: name the transport-failover leg explicitly in
        # CI. These are mocked-provider, real-loop/real-Db proofs: no keys, no network,
        # no model spend, no live/organic truth upgrade.
        run: |
          cargo test -p friday-hub --test provider_failover -- --nocapture
          cargo test -p friday-hub provider_failover --lib -- --nocapture
      - name: Artifact lifecycle stress proofs
        # P0 multi-angle stress residue: pin surface timeline, crash recovery,
        # retention/reaper, and ledger-vs-reaper contention as explicit CI legs.
        # These are local real-Db/real-loop proofs: no keys, no network, no model spend,
        # no live/organic truth upgrade.
        run: |
          cargo test -p friday-hub --test surface_events_timeline -- --nocapture
          cargo test -p friday-hub --test crash_recovery -- --nocapture
          cargo test -p friday-hub --bin hub_agent_run_server retention_sweep_runs_only_on_enabled_reaper_tick -- --nocapture
          cargo test -p friday-storage flag_on_sweep_prunes_only_old_terminal_rows_others_untouched --lib -- --nocapture
          cargo test -p friday-storage --test atomic concurrent_billing_survives_a_reaper_sweeping_on_a_short_cadence -- --nocapture
      - name: Setup Node for sealed-client interop proof
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - name: Install sealed-client interop dependencies
        working-directory: .
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done
      - name: Build sealed-client interop runner
        working-directory: .
        run: node test/interop/build-sealed-client-runner.mjs
      - name: TS route to Rust interop proofs
        run: |
          cargo test -p friday-hub interop_ts_memory_route_decision_confirms_real_rust_candidate --bin hub_agent_run_server -- --ignored --nocapture
          cargo test -p friday-hub interop_ts_agent_start_route_drives_real_rust_run_and_readback --bin hub_agent_run_server -- --ignored --nocapture
          cargo test -p friday-hub interop_ts_mission_route_lifecycle_and_workitem_hit_real_rust_spine --bin hub_agent_run_server -- --ignored --nocapture
          cargo test -p friday-hub interop_ts_mission_route_auto_dispatch_to_mission_bound_run --bin hub_agent_run_server -- --ignored --nocapture
