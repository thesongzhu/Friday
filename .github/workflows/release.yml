name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example: v0.3.1)"
        required: true
        type: string
      release_mode:
        description: "Release mode: 'source-only' (npm + source tarball; no macOS build) or 'source-and-macos' (also produce notarized DMG / Homebrew cask). Push-tag triggers always behave as 'source-only'."
        required: false
        type: choice
        default: "source-only"
        options:
          - source-only
          - source-and-macos

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  authorize-release-actor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ACTOR: ${{ github.actor }}
      REPOSITORY: ${{ github.repository }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: Checkout (full history for ancestry check)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Authorize actor by permission tier
        run: |
          set -euo pipefail
          # Mirrors the cloud-e2e.yml authorize-live-run permission tier
          # check (same admin|maintain|write set per d-G1.3.2). This is the
          # FIRST gate of the release workflow; nothing else runs until this
          # passes.
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission')"
          case "${permission}" in
            admin|maintain|write)
              echo "Actor ${ACTOR} authorized with ${permission} permission."
              ;;
            *)
              echo "::error::Actor ${ACTOR} has '${permission}' permission. Release authorization requires admin, maintain, or write."
              exit 1
              ;;
          esac

      - name: Validate trigger and ref
        run: |
          set -euo pipefail
          # Per d-G1.3.1 the gate behaves differently per trigger:
          #  - push-tag: workflow trigger filter already restricts to v*; the
          #    ancestry check below validates the tag points at a main-history
          #    commit. No further ref check needed here.
          #  - workflow_dispatch: must originate from main (per d-G1.3.3) so
          #    operators cannot bypass branch protection by dispatching from
          #    a feature branch and supplying an arbitrary tag input.
          case "${EVENT_NAME}" in
            push)
              if [ "${REF_TYPE}" != "tag" ]; then
                echo "::error::push trigger expected ref_type=tag, got ref_type=${REF_TYPE} ref_name=${REF_NAME}."
                exit 1
              fi
              echo "Push-tag trigger: tag=${REF_NAME}"
              ;;
            workflow_dispatch)
              if [ "${REF_TYPE}" != "branch" ] || [ "${REF_NAME}" != "main" ]; then
                echo "::error::Manual release dispatch must be run from the main branch (got ref_type=${REF_TYPE} ref_name=${REF_NAME}). To release from a tag, push the tag and let the push-tag trigger fire."
                exit 1
              fi
              if [ -z "${DISPATCH_TAG}" ]; then
                echo "::error::workflow_dispatch requires the 'tag' input."
                exit 1
              fi
              echo "Dispatch trigger: tag=${DISPATCH_TAG} from ref_type=${REF_TYPE} ref_name=${REF_NAME}"
              ;;
            *)
              echo "::error::Unsupported trigger '${EVENT_NAME}' for release.yml; only push-tag and workflow_dispatch are allowed."
              exit 1
              ;;
          esac

      - name: Ancestry check — tag commit must be reachable from origin/main
        run: |
          set -euo pipefail
          # Per d-G1.3.1 the ancestor check is the load-bearing rule: actor
          # tier alone is insufficient because a write actor could otherwise
          # `git tag v* <some-non-main-sha>` and bypass branch protection.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${DISPATCH_TAG}"
          else
            TAG_NAME="${REF_NAME}"
          fi

          # ^{commit} forces resolution to the underlying commit object even
          # when TAG_NAME points to an annotated tag. Same convention used by
          # public-preflight's tag_sha resolution (P4-G1.2).
          TAG_SHA="$(git rev-parse "${TAG_NAME}^{commit}")"
          echo "Tag ${TAG_NAME} resolves to commit ${TAG_SHA}"

          # Explicit fetch of origin/main + tags as defense-in-depth even
          # though `fetch-depth: 0` above already pulled full history. Keeps
          # the ancestor check unambiguous if actions/checkout ever changes
          # its default ref-pruning behavior.
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git fetch --tags --force origin

          if ! git merge-base --is-ancestor "${TAG_SHA}" "origin/main"; then
            echo "::error::Tag ${TAG_NAME} (commit ${TAG_SHA}) is NOT an ancestor of origin/main."
            echo "::error::Releases must be cut from commits that have already been merged into main via the protected merge path. If this is a hotfix on an unmerged branch, merge to main first or coordinate with maintainers to extend this gate before re-attempting the release."
            exit 1
          fi
          echo "Tag commit ${TAG_SHA} is reachable from origin/main."

      - name: Authorization summary
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${DISPATCH_TAG}"
          else
            TAG_NAME="${REF_NAME}"
          fi
          echo "Release authorized: actor=${ACTOR} trigger=${EVENT_NAME} tag=${TAG_NAME}"

  public-preflight:
    needs: authorize-release-actor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag_name: ${{ steps.resolve_tag.outputs.tag_name }}
      tag_sha: ${{ steps.resolve_tag_sha.outputs.tag_sha }}
      release_mode: ${{ steps.resolve_release_mode.outputs.release_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: resolve_tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> "${GITHUB_ENV}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Using tag: ${TAG_NAME}"

      - name: Validate tag format
        run: |
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            echo "::error::Tag must match v<semver> (for example: v0.3.1)"
            exit 1
          fi

      - name: Resolve release mode
        id: resolve_release_mode
        run: |
          set -euo pipefail
          # Push-tag triggers (e.g. `git push origin v1.0.1`) always behave as
          # source-only because there is no UI to choose otherwise and the
          # default v1.0.1 release boundary forbids claiming notarized macOS
          # / Homebrew distribution. Manual workflow_dispatch honors the
          # operator's input (default: source-only).
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.release_mode }}"
            if [ -z "${MODE}" ]; then
              MODE="source-only"
            fi
          else
            MODE="source-only"
          fi
          case "${MODE}" in
            source-only|source-and-macos)
              echo "release_mode=${MODE}" >> "${GITHUB_OUTPUT}"
              echo "Release mode: ${MODE}"
              ;;
            *)
              echo "::error::Unknown release_mode '${MODE}'. Allowed: source-only, source-and-macos."
              exit 1
              ;;
          esac

      - name: Resolve tag SHA
        id: resolve_tag_sha
        run: |
          set -euo pipefail
          # ^{commit} forces resolution to the underlying commit object even
          # when TAG_NAME points to an annotated tag object. The downstream
          # live-proof-gate uses this SHA to find the Real Green Gate run for
          # this exact commit (P4-G1.1 strict same-SHA validator contract).
          TAG_SHA="$(git rev-parse "${TAG_NAME}^{commit}")"
          echo "tag_sha=${TAG_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${TAG_NAME} to commit ${TAG_SHA}"

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Verify tag equals package version
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=${TAG_VERSION} package=${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag version does not match package.json version"
            exit 1
          fi

      - name: Public release preflight
        env:
          FRIDAY_RELEASE_TAG: ${{ env.TAG_NAME }}
          FRIDAY_RELEASE_MODE: ${{ steps.resolve_release_mode.outputs.release_mode }}
          FRIDAY_MACOS_CODESIGN_IDENTITY: ${{ vars.FRIDAY_MACOS_CODESIGN_IDENTITY }}
          FRIDAY_MACOS_NOTARY_PROFILE: ${{ vars.FRIDAY_MACOS_NOTARY_PROFILE }}
          FRIDAY_MACOS_SPARKLE_PRIVATE_KEY: ${{ secrets.FRIDAY_MACOS_SPARKLE_PRIVATE_KEY }}
          FRIDAY_MACOS_SPARKLE_PUBLIC_KEY: ${{ vars.FRIDAY_MACOS_SPARKLE_PUBLIC_KEY }}
          FRIDAY_MACOS_APPCAST_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}
          FRIDAY_HOMEBREW_TAP_REPO: ${{ vars.FRIDAY_HOMEBREW_TAP_REPO }}
          FRIDAY_HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.FRIDAY_HOMEBREW_TAP_GITHUB_TOKEN }}
          FRIDAY_IOS_APPLE_TEAM_ID: ${{ vars.FRIDAY_IOS_APPLE_TEAM_ID }}
          FRIDAY_IOS_BUNDLE_ID: ${{ vars.FRIDAY_IOS_BUNDLE_ID }}
          FRIDAY_IOS_APP_STORE_CONNECT_KEY_ID: ${{ vars.FRIDAY_IOS_APP_STORE_CONNECT_KEY_ID }}
          FRIDAY_IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ vars.FRIDAY_IOS_APP_STORE_CONNECT_ISSUER_ID }}
          FRIDAY_IOS_APP_STORE_CONNECT_PRIVATE_KEY_PATH: ${{ secrets.FRIDAY_IOS_APP_STORE_CONNECT_PRIVATE_KEY_PATH }}
          FRIDAY_ANDROID_APPLICATION_ID: ${{ vars.FRIDAY_ANDROID_APPLICATION_ID }}
          FRIDAY_ANDROID_KEYSTORE_PATH: ${{ secrets.FRIDAY_ANDROID_KEYSTORE_PATH }}
          FRIDAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FRIDAY_ANDROID_KEYSTORE_PASSWORD }}
          FRIDAY_ANDROID_KEY_ALIAS: ${{ vars.FRIDAY_ANDROID_KEY_ALIAS }}
          FRIDAY_ANDROID_KEY_PASSWORD: ${{ secrets.FRIDAY_ANDROID_KEY_PASSWORD }}
          FRIDAY_ANDROID_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.FRIDAY_ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          FRIDAY_WINDOWS_CODESIGN_PFX_PATH: ${{ secrets.FRIDAY_WINDOWS_CODESIGN_PFX_PATH }}
          FRIDAY_WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.FRIDAY_WINDOWS_CODESIGN_PFX_PASSWORD }}
          FRIDAY_CROSS_PLATFORM_MACOS_SMOKE_TARGET: ${{ vars.FRIDAY_CROSS_PLATFORM_MACOS_SMOKE_TARGET }}
          FRIDAY_CROSS_PLATFORM_IOS_SMOKE_TARGET: ${{ vars.FRIDAY_CROSS_PLATFORM_IOS_SMOKE_TARGET }}
          FRIDAY_CROSS_PLATFORM_ANDROID_SMOKE_TARGET: ${{ vars.FRIDAY_CROSS_PLATFORM_ANDROID_SMOKE_TARGET }}
          FRIDAY_CROSS_PLATFORM_WINDOWS_SMOKE_TARGET: ${{ vars.FRIDAY_CROSS_PLATFORM_WINDOWS_SMOKE_TARGET }}
          FRIDAY_RELEASE_PREFLIGHT_ARTIFACT_DIR: artifacts/release-preflight
        run: npm run release:preflight

      - name: Upload release preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-release-preflight-${{ github.run_id }}
          path: artifacts/release-preflight/
          if-no-files-found: warn

  verify:
    needs: public-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag_name: ${{ needs.public-preflight.outputs.tag_name }}
      release_mode: ${{ needs.public-preflight.outputs.release_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.public-preflight.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Final closeout
        run: npm run closeout:final

  live-proof-gate:
    needs:
      - public-preflight
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.public-preflight.outputs.tag_name }}
      TAG_SHA: ${{ needs.public-preflight.outputs.tag_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.public-preflight.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Find Real Green Gate run for tag SHA
        id: find_run
        run: |
          set -euo pipefail
          if [ -z "${TAG_SHA}" ]; then
            echo "::error::tag_sha output from public-preflight is empty; cannot locate Real Green Gate run."
            exit 1
          fi
          # Workflow file path is the source of truth (per d-G1.2.2). Pulls the
          # workflow-specific runs endpoint, filtered to successful runs on the
          # exact tag SHA. GitHub returns runs sorted by created_at desc, so
          # .workflow_runs[0] is the most recent successful run.
          RUN_ID="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/real-green-gate.yml/runs" -f head_sha="${TAG_SHA}" -f status=success --jq '.workflow_runs[0].id // empty')"
          if [ -z "${RUN_ID}" ]; then
            echo "::error::No successful Real Green Gate run found on commit ${TAG_SHA} (tag ${TAG_NAME})."
            echo "::error::Run \"gh workflow run real-green-gate.yml -r ${TAG_NAME}\" to generate release proof on this commit, then re-run this release workflow. (P4-G1.4: no auto-trigger; no break-glass.)"
            exit 1
          fi
          echo "Found Real Green Gate run ${RUN_ID} for commit ${TAG_SHA}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download Real Green Gate artifact
        uses: actions/download-artifact@v4
        with:
          name: real-green-gate-${{ steps.find_run.outputs.run_id }}
          path: ./real-green-gate-download
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate Real Green Gate result
        run: |
          set -euo pipefail
          ARTIFACT_PATH="./real-green-gate-download/real-green-gate-result.json"
          if [ ! -f "${ARTIFACT_PATH}" ]; then
            echo "::error::Expected artifact file ${ARTIFACT_PATH} is not present after download. The Real Green Gate run may have published a different artifact shape, or the artifact has expired (default GitHub Actions retention is 90 days). Re-run the Real Green Gate workflow on commit ${TAG_SHA} to regenerate."
            exit 1
          fi
          # Validator is the P4-G1.1 stable-token CLI. Exit 0 only on a clean
          # release-proof pass: status=passed AND scenarios consistent AND
          # blocked_reasons empty AND commit_sha matches expected. The CLI
          # prints its own structured rejection JSON to stdout on failure.
          node scripts/ops/validate-real-green-gate-result.mjs \
            --path "${ARTIFACT_PATH}" \
            --expected-sha "${TAG_SHA}" \
            --required-evidence-kind real-runtime \
            --required-evidence-kind real-provider \
            --required-evidence-kind real-browser

      - name: Assert RGG run was workflow_dispatch (channel phase24X jobs only run on manual dispatch)
        env:
          RUN_ID: ${{ steps.find_run.outputs.run_id }}
        run: |
          set -euo pipefail
          EVENT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.event')"
          echo "Real Green Gate run ${RUN_ID} event=${EVENT}"
          if [ "${EVENT}" != "workflow_dispatch" ]; then
            echo "::error::Channel live-proof gate requires the same-SHA Real Green Gate run to have been dispatched manually with phase24b/c/d trusted-inbound plus phase24e/f/g workflow-candidate inputs set true and operator messages sent. Re-run: gh workflow run real-green-gate.yml -r ${TAG_NAME} -f phase24b_discord_trusted_inbound=true -f phase24c_telegram_trusted_inbound=true -f phase24d_lark_feishu_trusted_inbound=true -f phase24e_telegram_workflow_candidate=true -f phase24f_discord_workflow_candidate=true -f phase24g_lark_feishu_workflow_candidate=true"
            exit 1
          fi

      - name: Download Phase24B Discord trusted-inbound artifact
        uses: actions/download-artifact@v4
        with:
          name: phase24b-discord-trusted-inbound-${{ steps.find_run.outputs.run_id }}
          path: ./phase24b-discord-download
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download Phase24C Telegram trusted-inbound artifact
        uses: actions/download-artifact@v4
        with:
          name: phase24c-telegram-trusted-inbound-${{ steps.find_run.outputs.run_id }}
          path: ./phase24c-telegram-download
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download Phase24D Lark/Feishu trusted-inbound artifact
        uses: actions/download-artifact@v4
        with:
          name: phase24d-lark-feishu-trusted-inbound-${{ steps.find_run.outputs.run_id }}
          path: ./phase24d-lark-feishu-download
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download Phase24E Telegram workflow-candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: phase24e-telegram-workflow-candidate-${{ steps.find_run.outputs.run_id }}
          path: ./phase24e-telegram-workflow-candidate-download
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download Phase24F Discord workflow-candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: phase24f-discord-workflow-candidate-${{ steps.find_run.outputs.run_id }}
          path: ./phase24f-discord-workflow-candidate-download
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download Phase24G Lark/Feishu workflow-candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: phase24g-lark-feishu-workflow-candidate-${{ steps.find_run.outputs.run_id }}
          path: ./phase24g-lark-feishu-workflow-candidate-download
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate channel proof artifacts
        run: |
          set -euo pipefail
          DISCORD="./phase24b-discord-download/phase24b-discord-trusted-inbound-proof.json"
          TELEGRAM="./phase24c-telegram-download/phase24c-telegram-trusted-inbound-proof.json"
          LARK="./phase24d-lark-feishu-download/phase24d-lark-feishu-trusted-inbound-proof.json"
          TELEGRAM_WORKFLOW="./phase24e-telegram-workflow-candidate-download/phase24e-telegram-workflow-candidate-proof.json"
          DISCORD_WORKFLOW="./phase24f-discord-workflow-candidate-download/phase24f-discord-workflow-candidate-proof.json"
          LARK_WORKFLOW="./phase24g-lark-feishu-workflow-candidate-download/phase24g-lark-feishu-workflow-candidate-proof.json"
          for path in "${DISCORD}" "${TELEGRAM}" "${LARK}" "${TELEGRAM_WORKFLOW}" "${DISCORD_WORKFLOW}" "${LARK_WORKFLOW}"; do
            if [ ! -f "${path}" ]; then
              echo "::error::Expected channel-proof artifact ${path} is missing. Re-run real-green-gate.yml on ${TAG_SHA} with phase24b/c/d trusted-inbound and phase24e/f/g workflow-candidate inputs all set true, then complete the trusted-user/operator message probes."
              exit 1
            fi
          done
          node scripts/ops/validate-channel-proof-artifacts.mjs \
            --discord "${DISCORD}" \
            --telegram "${TELEGRAM}" \
            --lark-feishu "${LARK}" \
            --telegram-workflow-candidate "${TELEGRAM_WORKFLOW}" \
            --discord-workflow-candidate "${DISCORD_WORKFLOW}" \
            --lark-feishu-workflow-candidate "${LARK_WORKFLOW}" \
            --expected-sha "${TAG_SHA}"

  source-distribution:
    needs:
      - verify
      - live-proof-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Friday
        run: npm run build

      - name: Build source distribution
        env:
          FRIDAY_RELEASE_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.verify.outputs.tag_name }}
        run: npm run build:release:source

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: friday-source-release
          path: dist/releases/source

  macos-distribution:
    needs:
      - verify
      - live-proof-gate
    if: needs.verify.outputs.release_mode != 'source-only'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Friday
        run: npm run build

      - name: Build companion release bundle
        env:
          FRIDAY_MACOS_SPARKLE_PRIVATE_KEY: ${{ secrets.FRIDAY_MACOS_SPARKLE_PRIVATE_KEY }}
          FRIDAY_MACOS_SPARKLE_PUBLIC_KEY: ${{ vars.FRIDAY_MACOS_SPARKLE_PUBLIC_KEY }}
          FRIDAY_MACOS_APPCAST_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.verify.outputs.tag_name }}
          FRIDAY_HOMEBREW_TAP_REPO: ${{ vars.FRIDAY_HOMEBREW_TAP_REPO }}
          FRIDAY_HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.FRIDAY_HOMEBREW_TAP_GITHUB_TOKEN }}
        run: npm run release:companion:local

      - name: Build Hub Console app bundle
        run: npm run build:hub-console:native

      - name: Verify Hub Console app bundle
        run: npm run verify:hub-console:native

      - name: Build macOS DMG
        env:
          FRIDAY_RELEASE_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.verify.outputs.tag_name }}
        run: npm run build:companion:dmg

      - name: Upload macOS distribution
        uses: actions/upload-artifact@v4
        with:
          name: friday-macos-release
          path: |
            dist/macos/FridayCompanion.release.json
            dist/macos/FridayCompanion.release.md
            dist/macos/FridayHubConsole.app
            dist/releases/macos
            dist/releases/channels
            dist/releases/homebrew

  publish-npm:
    needs:
      - verify
      - live-proof-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build Friday
        run: npm run build

      - name: Resolve publish mode
        run: |
          MODE="${{ vars.RELEASE_PUBLISH_NPM }}"
          if [ "${MODE}" = "true" ]; then
            echo "PUBLISH_NPM=true" >> "${GITHUB_ENV}"
            echo "npm publish: enabled (RELEASE_PUBLISH_NPM=true)"
          elif [ "${MODE}" = "false" ]; then
            echo "PUBLISH_NPM=false" >> "${GITHUB_ENV}"
            echo "npm publish: skipped (RELEASE_PUBLISH_NPM=false)"
          elif [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "PUBLISH_NPM=true" >> "${GITHUB_ENV}"
            echo "npm publish: enabled (NPM_TOKEN present, auto mode)"
          else
            echo "PUBLISH_NPM=false" >> "${GITHUB_ENV}"
            echo "npm publish: skipped (NPM_TOKEN missing, auto mode)"
          fi

      - name: Publish to npm
        if: env.PUBLISH_NPM == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Skip npm publish notice
        if: env.PUBLISH_NPM != 'true'
        run: echo "::warning::NPM_TOKEN is not configured. GitHub release artifacts will be created without npm publication."

  create-release:
    needs:
      - verify
      - live-proof-gate
      - source-distribution
      - macos-distribution
      - publish-npm
    # `macos-distribution` skips in source-only mode. Without an explicit `if:`,
    # GitHub Actions would cascade-skip `create-release` and the GitHub Release
    # would never be published. Require all required deps to have succeeded,
    # and tolerate `macos-distribution` being skipped iff release_mode is
    # source-only. This intentionally fails closed: any other dep skipping or
    # failing blocks the release.
    if: |
      always()
      && needs.verify.result == 'success'
      && needs.live-proof-gate.result == 'success'
      && needs.source-distribution.result == 'success'
      && needs.publish-npm.result == 'success'
      && (needs.macos-distribution.result == 'success'
          || (needs.macos-distribution.result == 'skipped'
              && needs.verify.outputs.release_mode == 'source-only'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: friday-source-release
          path: .

      - name: Download macOS distribution
        if: needs.verify.outputs.release_mode != 'source-only'
        uses: actions/download-artifact@v4
        with:
          name: friday-macos-release
          path: .

      - name: Write release manifest
        env:
          FRIDAY_RELEASE_TAG: ${{ needs.verify.outputs.tag_name }}
          FRIDAY_RELEASE_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.verify.outputs.tag_name }}
          FRIDAY_RELEASE_MODE: ${{ needs.verify.outputs.release_mode }}
        run: npm run release:manifest

      - name: Resolve release files
        id: release_files
        env:
          RELEASE_MODE: ${{ needs.verify.outputs.release_mode }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_MODE}" = "source-only" ]; then
            FILES=$'dist/releases/**/*\n'
          else
            FILES=$'dist/releases/**/*\ndist/macos/FridayCompanion.release.json\ndist/macos/FridayCompanion.release.md\n'
          fi
          {
            echo "files<<EOF"
            printf '%s' "${FILES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag_name }}
          generate_release_notes: true
          files: ${{ steps.release_files.outputs.files }}
