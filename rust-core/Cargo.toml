# Friday Rust Core — workspace
#
# Unit 2 (Rust Core foundation) of the Friday Rust/mobile rewrite.
# See ../rust-core/README.md and the goal folder
# /Users/jarvis/Desktop/friday-rust-mobile-rewrite-goals-20260601
# (files 03, 15, 21) for scope. Overall product status is NO-GO (greenfield);
# this workspace implements only the foundation slice.
#
# Crate boundaries follow architecture gate 21 §1. Dependency direction is
# acyclic: friday-core <- {crypto, storage, deepseek} <- {ffi}. friday-deepseek
# (provider-secret-bearing, Hub-only) is deliberately NOT in friday-ffi's
# (phone) dependency graph — asserted by friday-arch-tests.

[workspace]
resolver = "2"
members = [
    "crates/friday-core",
    "crates/friday-crypto",
    "crates/friday-protocol",
    "crates/friday-transport",
    "crates/friday-storage",
    "crates/friday-deepseek",
    "crates/friday-anthropic",
    "crates/friday-providers",
    "crates/friday-fs",
    "crates/friday-hub",
    "crates/friday-ffi",
    "crates/friday-operator-cli",
    "crates/friday-arch-tests",
]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "SEE LICENSE IN ../LICENSE"
publish = false
rust-version = "1.80"

[workspace.dependencies]
# Pinned (no wildcards) for reproducible evidence; Cargo.lock is committed.
thiserror = "1.0.69"
chacha20poly1305 = { version = "0.10.1", features = ["getrandom"] }
sha2 = "0.10.8"
rusqlite = { version = "0.31.0", features = ["bundled"] }
toml = "0.8.19"
zeroize = { version = "1.8.2", features = ["derive"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
libc = "0.2"
# PII detection on the memory-recall path (Hub-only; ported from the oracle PII
# guard). Pure computation, no I/O. Used only by friday-hub, never by the phone FFI.
regex = "1.11.1"
# Ed25519 asymmetric approval signatures (S6a). The OPERATOR holds the PRIVATE
# signing key (offline, e.g. an S6c CLI); the Hub holds ONLY the PUBLIC verify
# key — so the Hub (where the agent runs) can VERIFY an approval but can never
# MINT one. Well-audited; v2.x over curve25519-dalek 4.x (already in the lock via
# x25519-dalek). `rand_core` enables OsRng keygen; `zeroize` wipes the secret on drop.
ed25519-dalek = { version = "2.1.1", features = ["rand_core", "zeroize"] }
# internal crates
friday-core = { path = "crates/friday-core" }
friday-crypto = { path = "crates/friday-crypto" }
friday-protocol = { path = "crates/friday-protocol" }
friday-transport = { path = "crates/friday-transport" }
friday-storage = { path = "crates/friday-storage" }
friday-deepseek = { path = "crates/friday-deepseek" }
friday-anthropic = { path = "crates/friday-anthropic" }
friday-providers = { path = "crates/friday-providers" }
friday-fs = { path = "crates/friday-fs" }
friday-hub = { path = "crates/friday-hub" }
friday-ffi = { path = "crates/friday-ffi" }

[profile.dev]
# bundled SQLite compiles faster with some opt; keep debug assertions on.
opt-level = 0
