# Friday Rust Core — workspace
#
# Unit 2 (Rust Core foundation) of the Friday Rust/mobile rewrite.
# See ../rust-core/README.md and the goal folder
# /Users/jarvis/Desktop/friday-rust-mobile-rewrite-goals-20260601
# (files 03, 15, 21) for scope. Overall product status is NO-GO (greenfield);
# this workspace implements only the foundation slice.
#
# Crate boundaries follow architecture gate 21 §1. Dependency direction is
# acyclic: friday-core <- {crypto, storage, deepseek} <- {ffi}. friday-deepseek
# (provider-secret-bearing, Hub-only) is deliberately NOT in friday-ffi's
# (phone) dependency graph — asserted by friday-arch-tests.

[workspace]
resolver = "2"
members = [
    "crates/friday-core",
    "crates/friday-crypto",
    "crates/friday-storage",
    "crates/friday-deepseek",
    "crates/friday-ffi",
    "crates/friday-arch-tests",
]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "SEE LICENSE IN ../LICENSE"
publish = false
rust-version = "1.80"

[workspace.dependencies]
# Pinned (no wildcards) for reproducible evidence; Cargo.lock is committed.
thiserror = "1.0.69"
chacha20poly1305 = { version = "0.10.1", features = ["getrandom"] }
sha2 = "0.10.8"
rusqlite = { version = "0.31.0", features = ["bundled"] }
toml = "0.8.19"
# internal crates
friday-core = { path = "crates/friday-core" }
friday-crypto = { path = "crates/friday-crypto" }
friday-storage = { path = "crates/friday-storage" }
friday-deepseek = { path = "crates/friday-deepseek" }
friday-ffi = { path = "crates/friday-ffi" }

[profile.dev]
# bundled SQLite compiles faster with some opt; keep debug assertions on.
opt-level = 0
