[package]
name = "friday-transport"
description = "Friday Rust Core — framed E2E transport: length-prefixed frames carrying session-sealed protocol envelopes over a socket, with a relay-forwarding model."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

# Carries friday-protocol envelopes sealed with friday-crypto session keys over a
