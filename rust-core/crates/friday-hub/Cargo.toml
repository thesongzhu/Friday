[package]
name = "friday-hub"
description = "Friday Hub runtime — composition root + agent turn loop (Hub-only). PR-6 tracer-bullet first slice: one composed turn through a mock LLM, proving the substrate seams snap together (classify -> gate -> authorize -> execute -> record). Not the runtime; not live."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
# DEPLOY-GO actuation gate (Barrier 3). DEFAULT-OFF. The default build has NO real,
# host-effecting `OsActuationBackend` compiled in: `OsIntentExecutor::production_default`
# returns `OsIntentExecutor<UnavailableBackend>` — the only constructible production
# backend is `UnavailableBackend`, which actuates NOTHING (compile-time property). A REAL
# backend can only ship via a deliberate, reviewable, RECOMPILED DEPLOY-GO cutover that
# enables this feature and supplies the impl — it can NEVER be flipped on at runtime
# (there is no `env::var` that selects a backend; the production selector remains pinned
# to `UnavailableBackend` until a real backend cutover is reviewed and wired). KEEP
# DEFAULT-OFF.
os-actuation-deploy-go = []

[dependencies]
friday-core.workspace = true
friday-crypto.workspace = true
# key_source wraps the master key + derived X25519 secret in `Zeroizing` so they
# wipe on drop (defense-in-depth for the long-lived server's boot key material).
zeroize.workspace = true
friday-protocol.workspace = true
friday-storage.workspace = true
friday-transport.workspace = true
# The composition layer (`authorize_mutating_action`, `agent_run`) operates on a
# `rusqlite::Connection`, so the turn-loop signatures name it directly.
rusqlite.workspace = true
# Secret-bearing provider crates — the Hub is where provider secrets/credentials
# live. Depending on them here (and NOT in friday-ffi) is the compile-time
# "no secret on phone" boundary, asserted by friday-arch-tests.
friday-deepseek.workspace = true
# S7 — the Claude/Anthropic route, DARK / default-off. Secret-bearing, Hub-only
# (same boundary as friday-deepseek; asserted by friday-arch-tests). Reachable only
# behind an explicit default-OFF selection; the DeepSeek path is unchanged.
friday-anthropic.workspace = true
# L2-3 vision (image_analysis) — the VisionModelClient DI trait + the real Claude vision impl +
# the deterministic stub. Secret-bearing, Hub-only (it reaches the Anthropic key via
# friday-anthropic's transport; same boundary as friday-anthropic/friday-deepseek, asserted by
# friday-arch-tests). The friday-hub VisionExecutor (vision_tools.rs) does the image
# acquisition + validation and delegates the model call here. DARK / default-OFF.
friday-vision.workspace = true
# B5 media tools (TTS/PDF/OCR) — Hub-only, DARK/default-off executor seams. Runtime defaults
# fail closed; tests inject deterministic stubs. Not linked into friday-ffi.
friday-tts.workspace = true
friday-pdf.workspace = true
friday-ocr.workspace = true
# B4 Studio/document export — Rust-owned DARK artifact core. Hub wiring stays
# default-off and metadata-only until a later product route/export cutover.
friday-studio.workspace = true
friday-providers.workspace = true
# The ToolExecutor's file read/write goes through the hardened workspace-root-contained
# safe-open — NEVER std::fs on an agent-supplied path.
friday-fs.workspace = true
# The live model returns free-text content; the tool-call protocol is a JSON object
# the Hub parses back into a RawToolCall. serde_json is the strict parser for that.
serde_json.workspace = true
# S6d: the resume bridge bin (`hub_resume_approval`) deserializes the S6c CLI's
# operator-signed approval JSON. Derive only; no I/O.
serde.workspace = true
# Refs-only hashing for the S0 dev write-bridge bin (`hub_run_task`): the final
# message is emitted as a sha256 hash + length, never as body text. Pure hashing,
# no I/O; already in the Hub closure via friday-storage/friday-crypto.
sha2.workspace = true
thiserror.workspace = true
# Memory-recall PII redaction (Hub-only — recall is Hub-side, the phone never
# recalls). Pure computation, no I/O. NOT depended on by friday-ffi (phone).
regex.workspace = true
# L2-1 web_fetch — the egress HTTP client (blocking ureq + rustls; no async runtime, no
# system certs) and the WHATWG URL parser for the SSRF guard. Hub-only: the agent loop +
# its tool executors run Hub-side, NEVER on the phone (friday-ffi excludes friday-hub from
# its dependency closure — asserted by friday-arch-tests). web_fetch ALWAYS resolves the
# host itself + validates every IP through ssrf_guard, then PINS the validated addresses
# into the ureq connection; auto-redirects are disabled and each hop is re-validated.
ureq.workspace = true
url.workspace = true
# L2-3 vision (image_analysis) — base64 decode-to-MEASURE for a caller data-uri (validate its
# payload + cap the DECODED size before sending). The VisionExecutor passes a data-uri's base64
# THROUGH unchanged (no re-encode); workspace/URL image bytes are encoded by friday-vision.
# Pure; no I/O. Already in Cargo.lock (transitively via ureq).
base64.workspace = true

[dev-dependencies]
# (ureq is a production dependency above — it also serves the LIVE Telegram channels proof
# in tests/telegram_live.rs, `#[ignore]`d, run only in the phase-24-live-channels CI env.)
ed25519-dalek.workspace = true
