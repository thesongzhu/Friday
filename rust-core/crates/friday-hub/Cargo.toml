[package]
name = "friday-hub"
description = "Friday Hub runtime — composition root + agent turn loop (Hub-only). PR-6 tracer-bullet first slice: one composed turn through a mock LLM, proving the substrate seams snap together (classify -> gate -> authorize -> execute -> record). Not the runtime; not live."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
friday-core.workspace = true
friday-crypto.workspace = true
# key_source wraps the master key + derived X25519 secret in `Zeroizing` so they
# wipe on drop (defense-in-depth for the long-lived server's boot key material).
zeroize.workspace = true
friday-protocol.workspace = true
friday-storage.workspace = true
friday-transport.workspace = true
# The composition layer (`authorize_mutating_action`, `agent_run`) operates on a
# `rusqlite::Connection`, so the turn-loop signatures name it directly.
rusqlite.workspace = true
# Secret-bearing provider crates — the Hub is where provider secrets/credentials
# live. Depending on them here (and NOT in friday-ffi) is the compile-time
# "no secret on phone" boundary, asserted by friday-arch-tests.
friday-deepseek.workspace = true
friday-providers.workspace = true
# The ToolExecutor's file read/write goes through the hardened workspace-root-contained
# safe-open — NEVER std::fs on an agent-supplied path.
friday-fs.workspace = true
# The live model returns free-text content; the tool-call protocol is a JSON object
# the Hub parses back into a RawToolCall. serde_json is the strict parser for that.
serde_json.workspace = true
# S6d: the resume bridge bin (`hub_resume_approval`) deserializes the S6c CLI's
# operator-signed approval JSON. Derive only; no I/O.
serde.workspace = true
# Refs-only hashing for the S0 dev write-bridge bin (`hub_run_task`): the final
# message is emitted as a sha256 hash + length, never as body text. Pure hashing,
# no I/O; already in the Hub closure via friday-storage/friday-crypto.
sha2.workspace = true
thiserror.workspace = true
# Memory-recall PII redaction (Hub-only — recall is Hub-side, the phone never
# recalls). Pure computation, no I/O. NOT depended on by friday-ffi (phone).
regex.workspace = true

[dev-dependencies]
# TEST-ONLY HTTP client for the LIVE Telegram channels proof (tests/telegram_live.rs,
# `#[ignore]`d, run only in the phase-24-live-channels CI env). dev-dependencies are NOT
# part of the production dependency graph (friday-arch-tests scans dependencies /
# build-dependencies only) and never reach the phone (friday-ffi).
ureq = { version = "2", features = ["json"] }
